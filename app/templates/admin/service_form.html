{% extends "admin/layout.html" %}
{% block title %}{% if service %}Edit Service{% else %}Add Service{% endif %}{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">{% if service %}Edit Service{% else %}Add Service{% endif %}</h2>
<form action="" method="post" class="space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1">Name</label>
    <input type="text" name="name" value="{{ service.name if service else '' }}" class="w-full border rounded px-3 py-2" required>
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Price</label>
    <input type="number" step="0.01" name="price" value="{{ service.price if service else '' }}" class="w-full border rounded px-3 py-2" required>
  </div>
  <div class="text-right">
    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Save</button>
    <a href="{{ url_for('admin.list_services') }}" class="ml-2 text-gray-600 hover:underline">Cancel</a>
  </div>
</form>
{% endblock %}
