{% extends "admin/layout.html" %}
{% block title %}{% if customer %}Edit Customer{% else %}Add Customer{% endif %}{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">{% if customer %}Edit Customer{% else %}Add Customer{% endif %}</h2>
<form method="post" class="space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1">Name</label>
    <input type="text" name="name"
           value="{{ customer.name if customer else '' }}"
           class="w-full border rounded px-3 py-2" required>
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Phone</label>
    <input type="text" name="phone"
           value="{{ customer.phone if customer else '' }}"
           class="w-full border rounded px-3 py-2">
  </div>
  <div class="text-right">
    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Save</button>
    <a href="{{ url_for('admin.list_customers') }}" class="ml-2 text-gray-600 hover:underline">Cancel</a>
  </div>
</form>
{% endblock %}
