<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber System – Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind configuration for better theming -->
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6', secondary: '#6b7280' } } } }</script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-4">
            <h1 class="text-2xl font-semibold text-gray-800">Barber System</h1>
        </div>
    </header>
    <main class="container mx-auto px-4 py-8">
        <section class="mb-12">
            <h2 class="text-lg font-medium text-gray-700 mb-4">Our Barbers</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {% for barber in barbers %}
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="p-6">
                        <h3 class="text-xl font-semibold text-gray-900">{{ barber.name }}</h3>
                        <!-- <p class="text-gray-600">{{ barber.phone or "No phone" }}</p> -->
                    </div>
                </div>
                {% endfor %}
            </div>
        </section>
        <section>
            <h2 class="text-lg font-medium text-gray-700 mb-4">Services</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {% for service in services %}
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="p-6">
                        <h3 class="text-xl font-semibold text-gray-900">{{ service.name }}</h3>
                        <p class="text-gray-600">Price: <span class="font-medium text-primary">${{ service.price }}</span></p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </section>
    </main>
    <footer class="bg-white shadow-sm py-4">
        <div class="container mx-auto text-center text-gray-600">
            © 2026 Barber System
        </div>
    </footer>
</body>
</html>
